<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SpeakSpace | Practice</title>

  <link rel="stylesheet" href="../design/style.css">
</head>

<body class="practice-page">

  <section class="ai-feedback-option" aria-label="Optional feedback">

    <div class="ai-feedback-copy">
      <span class="ai-feedback-label">Optional feedback</span>
      <span class="ai-feedback-message">Analyze your audio after practice</span>
    </div>

    <label class="switch">
      <input
        type="checkbox"
        id="aiFeedbackToggle"
      >

      <span class="slider"></span>
    </label>

  </section>

  <header class="site-header">
    <a class="brand" href="../index.html">
      <span class="brand-mark">SS</span>
      SpeakSpace
    </a>

    <a class="text-link" href="topics.html">
      Change topic <span></span>
    </a>
  </header>


  <main class="practice-shell">

    <p class="eyebrow" id="categoryText">
      YOUR SESSION
    </p>

    <h1 class="practice-topic" id="topicText">
      Loading your topic...
    </h1>


    <div id="aiFeedbackStatus" class="ai-feedback-status is-hidden">
      Preparing your feedback...
    </div>


    <!-- PRACTICE AREA -->

    <div id="practiceArea">

      <div class="timer" id="timer">
        02:00
      </div>

      <p class="status" id="status">
        Ready when you are
      </p>

      <button type="button" class="mic" id="mic" aria-label="Start recording">

        <svg class="icon-mic" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
        </svg>

        <svg class="icon-stop" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>

      </button>

      <div class="control-row">

        <button
          class="control-button"
          id="startBtn"
        >
          Start speaking
        </button>

        <button
          class="control-button"
          id="stopBtn"
          disabled
        >
          Stop
        </button>

      </div>

    </div>

    <div
      id="result"
      class="result-card is-hidden"
    ></div>

  </main>


  <script src="../js/practice.js"></script>

</body>
</html>
